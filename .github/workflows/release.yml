# Build a downloadable bundle of three for each platform.
#
# What a user gets is a zip they extract and run: the binary — with the shader
# templates AND the whole Slang compiler inside it — and, on macOS, the Vulkan
# driver. Nothing to install and nothing to build.
#
# The driver is the only library left beside the executable, and it is there
# because it cannot be anywhere else: vk/driver.c3 dlopens it by name at
# runtime. Slang used to sit beside it as three dylibs; it is linked in now, by
# lib/slang.c3l/native/build-slang.sh and setup.sh's `static` step. See
# lib/slang.c3l/README.md, "Linking Slang in".
#
#   push a tag v*        build every platform, publish a GitHub release
#   run it by hand       build every platform, keep the zips as artifacts
#
# ## What is checked here, and what is deliberately NOT
#
# **Nothing renders on a GitHub runner, on purpose.** None of the three images
# is a machine three.c3 is meant to draw on: the Linux one has no GPU and would
# be drawing on lavapipe, the Windows one has no ICD at all, and the macOS ones
# are VMs — `macos-26` loads the bundled KosmicKrisp and then answers
# `VK_ERROR_INITIALIZATION_FAILED`, because a paravirtualised GPU is not what a
# Metal 4 driver wants. A red release because a runner has no graphics card is
# noise, and a green one drawn by a software rasteriser proves nothing about the
# hardware path anyway.
#
# So what runs below is what a GPU-less machine can honestly say about a zip:
#
#   the bundle STARTS         `--help` prints its usage from inside the bundle,
#                             which is the whole linkage test — a library that
#                             is not beside the exe makes the process fail
#                             before `main`, printing nothing (0xC0000135 on
#                             Windows, a dyld/ld.so line on the others)
#   the driver is SHIPPABLE   macOS only: the dylib is in the zip, is arm64, and
#                             exports the ICD entry point vk/driver.c3 dlsyms
#
# **Rendering is verified by hand before a release**, with `packaging/smoke.js`
# on a real machine — that script is still the check for "the embedded shader
# templates resolved and the shadow shader built", and it is the one thing CI
# cannot stand in for: a shadow shader that does not build prints a warning,
# renders an unshadowed frame and **exits 0**, so nothing but an assertion on
# what was drawn finds it.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (tag builds do this anyway)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  C3C_VERSION: v0.8.3

jobs:
  build:
    name: ${{ matrix.bundle }}
    runs-on: ${{ matrix.runner }}
    # Kept for the legs that are commented out of the matrix below: a red
    # experimental leg must not withhold the other zips from a release. With
    # only macOS in the matrix this evaluates false and does nothing.
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 rather than macos-14, which is deprecated anyway: nothing
          # here has to RUN the bundled driver, but the image should not be
          # older than the thing it is packaging. KosmicKrisp is a Metal 4
          # driver — `otool -l libvulkan_kosmickrisp.dylib` says `minos 26.0`
          # and its undefined symbols are `_OBJC_CLASS_$_MTL4*` — so the zip
          # carries a macOS 26 floor that the engine itself does not.
          - bundle: three-macos-arm64
            runner: macos-26
            c3c_asset: c3-macos.zip
            target: macos-aarch64
            exe: three
          # ---------------------------------------------------------------
          # **Linux and Windows are commented out until their static Slang
          # archives exist.** The bundle links Slang IN now, and the archives
          # come off slang.c3l's `static` branch, which currently carries
          # macos-aarch64 alone. Slang cannot be cross-built — its build runs
          # code generators it compiled for the host — so each one has to be
          # produced on a machine of its own architecture:
          #
          #     ./lib/slang.c3l/native/build-slang.sh
          #     ./lib/slang.c3l/native/publish-static.sh
          #
          # Uncomment a leg once its archive is on that branch. Two things go
          # with it, and neither is optional:
          #
          #   - linux-x64 needs `-lstdc++` (or `-static-libstdc++`) in its
          #     manifest.json link-args, the way macos-aarch64 has `-lc++`. A
          #     static Slang does not carry its own C++ runtime dependency the
          #     way the dylib did, and without it the link ends in hundreds of
          #     undefined std:: symbols.
          #   - windows-x64 needs slang.lib built with a matching
          #     CMAKE_MSVC_RUNTIME_LIBRARY, and has never been linked on a real
          #     Windows toolchain at all.
          #
          # The steps below that are guarded by `runner.os` — the apt install,
          # the quickjs PIC rebuild, the mingw --cc branch — are left in place
          # and simply never fire, so re-enabling a leg is this block alone.
          #
          # - bundle: three-linux-x64
          #   runner: ubuntu-22.04
          #   c3c_asset: c3-linux-static.tar.gz
          #   target: linux-x64
          #   exe: three
          #
          # The Windows leg is the one with a NATIVE toolchain, so c3c hands
          # quickjs.c3l's `c-sources` to MSVC unless told otherwise — and that
          # manifest's cflags are the GNU spellings, which cl rejects outright
          # ("D8021: invalid numeric argument '/Wno-unused-parameter'"). mingw
          # is the compiler this target is designed around (the archive beside
          # the shim is mingw-built; see that manifest), and the image ships
          # gcc 14. The Build step below is what points c3c at it — and why it
          # cannot be a bare `--cc gcc` there.
          #
          # - bundle: three-windows-x64
          #   runner: windows-2022
          #   c3c_asset: c3-windows.zip
          #   target: windows-x64
          #   exe: three.exe
          #   experimental: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------------------------------------------------------------- c3c --
      - name: Install c3c
        run: |
          set -euo pipefail
          url="https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/${{ matrix.c3c_asset }}"
          echo "fetching $url"
          curl -fsSL -o c3c-dist "$url"
          mkdir -p "$HOME/c3c"
          case "${{ matrix.c3c_asset }}" in
            *.zip)     unzip -q c3c-dist -d "$HOME/c3c" ;;
            *.tar.gz)  tar -xzf c3c-dist -C "$HOME/c3c" ;;
          esac
          # The archives put everything under a single directory whose name has
          # changed between releases, so find the binary rather than assume it.
          c3c_bin="$(find "$HOME/c3c" -type f \( -name c3c -o -name c3c.exe \) | head -1)"
          test -n "$c3c_bin" || { echo "no c3c in the archive"; find "$HOME/c3c" -maxdepth 2; exit 1; }
          chmod +x "$c3c_bin" || true
          echo "$(dirname "$c3c_bin")" >> "$GITHUB_PATH"

      - name: c3c version
        run: c3c --version

      # ------------------------------------------------------ system packages --
      # This is a property of the RUNNER, not a requirement of the bundle: a
      # GitHub Linux image has no GPU and no graphics stack, so there is neither
      # a `libvulkan.so.1` for `vk::init` to dlopen nor an ICD to render on.
      # lavapipe is Mesa's software rasteriser and is what the smoke test draws
      # with. An ordinary Linux desktop already has both and installs nothing —
      # see packaging/bundle-README.md.
      - name: Install Vulkan loader and a software driver (runner has no GPU)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools zip

      # ------------------------------------------------------------- staging --
      # `submodules; slang; driver`. The `slang` step fetches slang.c3l's
      # prebuilt static archive off its `static` branch — the same shape as the
      # driver fetch beside it — so a release build downloads no SDK and stages
      # no dylibs at all.
      - name: setup.sh
        run: ./setup.sh

      # Fails early and by name. Two different failures are being headed off,
      # and neither says anything about Slang on its own:
      #
      #   no archive        `library not found for -lslang`, which names
      #                     neither the file nor the branch it comes from
      #   no manifest entry the same message, from the other direction —
      #                     `linked-libraries` is per target
      #
      # There is a third that this cannot check but that belongs in the same
      # breath: a target whose manifest link-args do not name a C++ runtime
      # (`-lc++`, `-lstdc++`) links a static Slang and ends in hundreds of
      # undefined std:: symbols. The dylib carried that dependency itself; the
      # archive does not. macos-aarch64 has it; a new target needs it adding.
      - name: Check the static Slang archive is in place
        run: |
          set -euo pipefail
          dir="lib/slang.c3l/lib/${{ matrix.target }}"
          name=libslang.a
          if [ "${{ runner.os }}" = Windows ]; then name=slang.lib; fi

          test -f "$dir/$name" || {
            echo "::error::$dir/$name is missing — setup.sh's slang step did not"
            echo "::error::produce it. slang.c3l's 'static' branch carries an archive"
            echo "::error::per target; build and publish this one on a ${{ matrix.target }}"
            echo "::error::machine with native/build-slang.sh + native/publish-static.sh."
            exit 1; }

          grep -q '"${{ matrix.target }}"' lib/slang.c3l/manifest.json || {
            echo "::error::lib/slang.c3l/manifest.json has no '${{ matrix.target }}' target,"
            echo "::error::so -lslang will not find the archive that is sitting right there."
            exit 1; }

          ls -la "$dir"

      # quickjs.c3l ships lib/linux-x64/libquickjs.a prebuilt, and that archive
      # was built without -fPIC. ELF x86-64 forbids the relocations non-PIC code
      # emits from inside a PIE, and `cc` links a PIE by default on every
      # current distro, so the *consumer* dies at the link naming a file it does
      # not own:
      #
      #   libquickjs.a(quickjs.o): relocation R_X86_64_32S against `.rodata'
      #   can not be used when making a PIE object
      #
      # macOS and Windows are unaffected — only ELF x86-64 has that constraint,
      # which is why this went unnoticed until a Linux leg existed.
      #
      # The real fix is `-fPIC` in quickjs.c3l's own native/build-quickjs.sh
      # plus a rebuilt archive committed there; that flag is now in the script
      # but the committed .a predates it. Rebuilding here is cheap (~5 s for
      # four translation units), needs nothing but the runner's own cc, and the
      # flag list is READ OUT OF the script rather than repeated, so the two
      # cannot drift. Drop this step once the archive in quickjs.c3l is PIC.
      - name: Rebuild the quickjs archive as PIC (the committed one is not)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd lib/quickjs.c3l
          common="$(sed -n 's/^COMMON="\(.*\)"$/\1/p' native/build-quickjs.sh)"
          test -n "$common" || {
            echo "::error::could not read COMMON out of native/build-quickjs.sh —"
            echo "::error::the script changed shape; update this step or drop it."
            exit 1; }
          echo "cflags: $common -fPIC"
          work="$(mktemp -d)"
          objs=""
          for unit in dtoa libregexp libunicode quickjs; do
            echo "  cc $unit.c"
            # shellcheck disable=SC2086
            cc -c "vendor/quickjs-ng/$unit.c" -Ivendor/quickjs-ng -Inative \
               -o "$work/$unit.o" $common -fPIC
            objs="$objs $work/$unit.o"
          done
          rm -f lib/linux-x64/libquickjs.a
          # shellcheck disable=SC2086
          ar rcs lib/linux-x64/libquickjs.a $objs
          rm -rf "$work"
          ls -la lib/linux-x64/

      # ---------------------------------------------------------------- build --
      # `--trust=full` is the documented invocation — a manifest that needs to
      # exec is silently skipped without it, which reports success and builds
      # the wrong thing. `--safe=no -O3` is claude.md's "the fast one", and a
      # release binary is exactly what it is for.
      #
      # **`--cc` must be a PATH, with the `.exe`, on Windows.** c3c 0.8.3 checks
      # the compiler it was handed with `file_executable_in_path`, which appends
      # no extension — so a bare `--cc gcc` fails that check on Windows and the
      # compiler falls back to `default_c_compiler()`, i.e. MSVC, *silently*.
      # The symptom is the D8021 above with no mention of --cc having been
      # ignored. A name containing a slash takes the plain `file_exists` branch
      # instead, which is why the resolved path works.
      - name: Build
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" != Windows ]; then
            c3c build --trust=full --safe=no -O3
            exit 0
          fi
          cc="$(command -v gcc || true)"
          test -n "$cc" || {
            echo "::error::no gcc on PATH — the runner image is expected to ship mingw."
            exit 1; }
          case "$cc" in *.exe) ;; *) cc="$cc.exe" ;; esac
          test -f "$cc" || { echo "::error::$cc does not exist"; exit 1; }
          cc="$(cygpath -w "$cc")"
          echo "C compiler: $cc"
          "$cc" --version | head -1
          c3c build --trust=full --safe=no -O3 --cc "$cc"

      - name: Show what was built
        run: ls -la build/

      # -------------------------------------------------------------- assemble --
      - name: Assemble the bundle
        id: assemble
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          case "$version" in
            v*) version="${version#v}" ;;
            *)  version="0.0.0-dev+$(git rev-parse --short HEAD)" ;;
          esac
          name="${{ matrix.bundle }}-${version}"
          out="dist/${name}"
          mkdir -p "$out"

          cp "build/${{ matrix.exe }}" "$out/"
          chmod +x "$out/${{ matrix.exe }}" || true

          # No shaders/, no launcher and no Slang. src/shader/load.c3 carries
          # the five templates in the binary and the compiler is linked in, so
          # the bundle is the executable plus, on macOS, the one library that
          # has to stay a file: the driver.

          # macOS arm64 is the only platform that bundles a driver; setup.sh
          # skips the fetch everywhere else and Linux/Windows use the system's.
          # stage-libs.sh rather than `cp -RL` because these are symlinks and a
          # dereferencing copy ships the same file once per alias.
          if [ -d "lib/vulkan.c3l/${{ matrix.target }}" ]; then
            echo "vulkan driver:"
            ./packaging/stage-libs.sh "lib/vulkan.c3l/${{ matrix.target }}" "$out"
          fi

          cp SKILL.md LICENSE "$out/" 2>/dev/null || true
          cp packaging/bundle-README.md "$out/README.md"

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "out=$out"   >> "$GITHUB_OUTPUT"
          echo "--- bundle contents ---"
          ls -la "$out"
          du -sh "$out"

      # ------------------------------------------------------------- verify --
      # Two checks, neither of which needs a GPU. See the header for why there
      # is no third one that draws.

      # A library that is not beside the executable makes the process die
      # before `main` — 0xC0000135 on Windows, a dyld or ld.so line on the
      # others — and in every case it prints nothing of its own. So usage text
      # coming back IS the linkage test, and it is run from INSIDE the bundle
      # so that what is tested is the zip rather than the build tree.
      #
      # With Slang linked in there is far less left for this to catch than
      # there was — the C++ runtime `-lc++` names, and the c3c runtime. That is
      # exactly why the otool check below exists: this step passing no longer
      # means the bundle is complete, only that it starts.
      - name: Check the bundle starts and its libraries resolve
        run: |
          set -euo pipefail
          cd "${{ steps.assemble.outputs.out }}"
          # `|| true` so that the dynamic loader's own complaint — which is the
          # only thing a failure here prints, and goes to stderr — reaches the
          # log instead of being swallowed by `set -e` one line early.
          ./${{ matrix.exe }} --help > help.log 2>&1 || true
          cat help.log
          grep -q -- '--headless' help.log || {
            echo "::error::${{ matrix.exe }} did not start — a library is missing from the bundle"
            exit 1; }
          rm -f help.log
          echo "::warning::CI verifies that this bundle LOADS. Rendering and the embedded shader templates are NOT verified here — run packaging/smoke.js on a real GPU before shipping."

      # **The check that the static link actually happened.** Everything above
      # this passes just as well for the old bundle: the binary starts either
      # way, because in the old shape the dylibs were sitting next to it. What
      # distinguishes the two is what the executable RECORDS as its
      # dependencies, and that is readable without running anything.
      #
      # It matters because the failure is silent and directional. `-lslang`
      # prefers a dylib to an archive when both are in the search path, so one
      # stray libslang.dylib left in lib/slang.c3l/lib/<target>/ — from a
      # developer's `./setup.sh slang`, or a `static` step that failed in a way
      # `set -e` did not catch — produces a bundle that builds, starts, passes
      # every other check here, and then dies in dyld on the user's machine
      # naming a library that was never put in the zip.
      - name: Check Slang is INSIDE the binary, not beside it
        run: |
          set -euo pipefail
          exe="${{ steps.assemble.outputs.out }}/${{ matrix.exe }}"

          case "${{ runner.os }}" in
            # tail -n +2 drops otool's header, which is the path to the
            # executable — and that path is built out of matrix.bundle, so it
            # must not be part of what is searched.
            macOS) deps="$(otool -L "$exe" | tail -n +2)" ;;
            Linux) deps="$(objdump -p "$exe" | awk '/NEEDED/ { print $2 }')" ;;
            *)     echo "no dependency dump for ${{ runner.os }} — skipped"; exit 0 ;;
          esac

          echo "--- recorded dependencies ---"
          echo "$deps"

          if echo "$deps" | grep -qi 'slang'; then
            echo "::error::${{ matrix.exe }} still records a Slang library as a runtime"
            echo "::error::dependency, so Slang was NOT linked in. Almost always a stale"
            echo "::error::dylib left in lib/slang.c3l/lib/${{ matrix.target }}/ by an older"
            echo "::error::checkout, which -lslang preferred to the archive. fetch-static.sh"
            echo "::error::sweeps those and names each one it removes — check the setup.sh log."
            exit 1
          fi
          echo "ok: no Slang library is loaded at runtime"

      # The macOS-only half, and the only thing about the driver a machine with
      # no GPU can still be sure of. `vk/driver.c3` dlopens this file and dlsyms
      # exactly one symbol out of it; both halves are checkable statically, and
      # the failure they guard is a packaging one — a driver missing from the
      # zip, staged for the wrong architecture, or replaced by something that is
      # not an ICD. `minos` is printed rather than asserted: it is the bundle's
      # OS floor (notes.md §10) and belongs in the log of the build that shipped
      # it, but nothing on this runner has to satisfy it any more.
      - name: Check the bundled driver is one
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          driver="${{ steps.assemble.outputs.out }}/libvulkan_kosmickrisp.dylib"
          test -f "$driver" || {
            echo "::error::no libvulkan_kosmickrisp.dylib in the bundle — setup.sh's"
            echo "::error::driver step was skipped, or stage-libs.sh did not copy it."
            exit 1; }
          file "$driver"
          lipo -archs "$driver" | grep -q arm64 || {
            echo "::error::the bundled driver is not arm64"; exit 1; }
          nm -gU "$driver" | grep -q _vk_icdGetInstanceProcAddr || {
            echo "::error::the bundled driver exports no vk_icdGetInstanceProcAddr,"
            echo "::error::which is the one symbol vk::loadDriver looks for."
            exit 1; }
          minos="$(otool -l "$driver" | awk '/LC_BUILD_VERSION/{f=1} f && /^ *minos/{print $2; exit}')"
          echo "driver ok: exports the ICD entry point, built for macOS ${minos:-unknown}"

      # ------------------------------------------------------------------ zip --
      - name: Zip
        run: |
          set -euo pipefail
          cd dist
          if command -v zip >/dev/null 2>&1; then
            zip -qry "${{ steps.assemble.outputs.name }}.zip" "${{ steps.assemble.outputs.name }}"
          else
            # Windows runners have bsdtar, which writes zip with -a.
            tar -a -c -f "${{ steps.assemble.outputs.name }}.zip" "${{ steps.assemble.outputs.name }}"
          fi
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.assemble.outputs.name }}
          path: dist/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- release --
  publish:
    needs: build
    # `always()` so a red experimental leg still ships the platforms that built.
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

# The website.
#
# Static HTML built by Node and handed to Pages as an artifact —
# `upload-pages-artifact` and `deploy-pages`, so there is no `gh-pages` branch
# and no generated file in the tree. Nothing here builds the engine: the API
# reference is generated by importing `src/js/prelude/docs.js` under a stub for
# its one host call, which needs no C3 compiler, no GPU and no binary. That is
# the whole reason this workflow is thirty lines and `release.yml` is six
# hundred.
#
# ONE THING HAS TO BE DONE BY HAND, once: Settings -> Pages -> Source ->
# "GitHub Actions". Nothing in a workflow can set it, and a repository left on
# the branch source serves the wrong thing silently.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/js/prelude/docs.js'
      - 'src/scene/input.c3'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'src/js/prelude/docs.js'
      - 'src/scene/input.c3'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer push win — but never cancel one that
# is already uploading, which is what leaves Pages serving half a site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Its own step, so a `docs.js` edit that breaks the reference fails on
      # the commit that made it and names itself in the log.
      - name: Generate the API reference
        run: node site/gen-api.mjs

      - name: Build
        run: node site/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # Only from `main`. A pull request gets the build as a check and deploys
  # nothing, which is the point of splitting the two.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
